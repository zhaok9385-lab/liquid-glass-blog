<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留言 · Tom</title>
<meta name="description" content="给这间小屋留一句话。留言保存在你自己的浏览器里。">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<script>
  try { if (localStorage.getItem('lg-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body data-page="messages">
<a class="skip-link" href="#main">跳到正文</a>
<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <div class="narrow-block">
      <header class="page-head">
        <h1>留言</h1>
        <p>没有后台、没有数据库。你写下的话只会存在这台设备的浏览器里 —— 像在书页边上写批注，只有你自己看得到。</p>
      </header>

      <div style="padding:32px 0 72px">
        <form class="form" id="msg-form" novalidate>
          <div class="field">
            <label for="f-name">称呼</label>
            <input id="f-name" name="name" type="text" maxlength="20" placeholder="怎么称呼你" autocomplete="nickname">
            <span class="err" id="err-name"></span>
          </div>
          <div class="field">
            <label for="f-text">说点什么</label>
            <textarea id="f-text" name="text" maxlength="500" placeholder="一句话，或者一个想法"></textarea>
            <span class="hint">500 字以内。仅保存在本机浏览器。</span>
            <span class="err" id="err-text"></span>
          </div>
          <div class="form-actions">
            <button class="btn-solid" type="submit">留下这句</button>
            <span class="hint" style="font-size:12px;color:var(--text-3)">按 Ctrl / ⌘ + Enter 快速发送</span>
          </div>
        </form>

        <h2 style="font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:48px 0 4px;font-weight:500">最近留言</h2>
        <div class="msg-list" id="msg-list"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/chrome.js"></script>
<script src="assets/js/render.js"></script>
<script>
  document.getElementById('f-text').addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      document.getElementById('msg-form').requestSubmit();
    }
  });
</script>
</body>
</html>
