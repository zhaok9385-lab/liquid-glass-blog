        <stop offset="0" stop-color="#8fc9ee"/><stop offset=".5" stop-color="#a6b4ee"/><stop offset="1" stop-color="#bfa8ec"/>

      <filter id="lens" x="-20%" y="-20%" width="140%" height="140%">

        <feDisplacementMap in="SourceGraphic" in2="soft" scale="46" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
