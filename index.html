<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom · 一个人的小屋</title>
<meta name="description" content="Tom 的个人小站：写代码、做设计、留一点光。纯静态、零构建。">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="Tom · RSS" href="feed.xml">
<link rel="preload" as="image" href="assets/img/hero.jpg" fetchpriority="high">
<link rel="stylesheet" href="assets/vendor/APlayer.min.css">
<link rel="stylesheet" href="assets/css/site.css">
<script>
  try { if (localStorage.getItem('lg-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body class="is-cover" data-chrome="none" data-page="cover">

  <main id="main">
  <div class="cover">
    <div class="cover-media">
      <img src="assets/img/hero.jpg" alt="清晨的山谷与雾" fetchpriority="high" width="1600" height="900">
    </div>
    <div class="cover-veil"></div>

    <div class="cover-inner">
      <p class="cover-eyebrow">Tom · @tom.gl</p>
      <blockquote class="cover-poem">
        <span class="poem-cn">落霞与孤鹜齐飞，<br>秋水共长天一色。</span>
        <span class="poem-en">The sunset clouds fly with the lonely duck; the autumn river shares one hue with the endless sky.</span>
        <span class="poem-by">王勃 ·《滕王阁序》</span>
      </blockquote>
      <div class="cover-actions">
        <a class="btn btn-primary" id="cover-enter" href="home.html">
          进入小屋
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </a>
        <a class="btn btn-ghost" href="about.html">先认识我</a>
      </div>
    </div>

    <div class="cover-stats glass">
      <span><b id="stat-posts">5</b> 篇文章</span>
      <span class="sep"></span>
      <span class="hide-sm"><b id="stat-chars">1.2 万</b> 字</span>
      <span class="sep hide-sm"></span>
      <span><b id="stat-since">2026.05</b> 起</span>
      <span class="sep"></span>
      <span><b id="stat-days">199</b> 天</span>
    </div>

    <button class="cover-music" id="splash-music" aria-label="播放背景音乐" title="播放 / 暂停音乐">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M9 18V6.5l9-2v11.5"/>
        <circle cx="6.6" cy="18" r="2.4"/>
        <circle cx="15.6" cy="16.2" r="2.4"/>
      </svg>
    </button>
  </div>
  </main>

  <div id="aplayer-mount"></div>

  <script src="assets/vendor/APlayer.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/post.js"></script>
  <script src="assets/js/music.js"></script>
  <script src="assets/js/router.js"></script>
</body>
</html>
