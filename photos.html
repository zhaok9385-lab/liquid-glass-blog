<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相册 · Tom</title>
<meta name="description" content="路上遇到的光：云海、晨雾、海边的黄昏。">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/vendor/APlayer.min.css">
<link rel="stylesheet" href="assets/css/site.css">
<script>
  try { if (localStorage.getItem('lg-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body data-page="photos">
<a class="skip-link" href="#main">跳到正文</a>
<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <header class="page-head">
      <h1>相册</h1>
      <p>路上遇到的光。不带任何后期思路，就是按快门那一刻看到的样子。</p>
    </header>

    <div class="album-bar">
      <p class="album-hint" id="album-hint">照片只保存在这台设备的浏览器里，换设备看不到。</p>
      <div class="album-actions">
        <label class="btn btn-ghost album-add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          上传照片
          <input type="file" id="photo-input" accept="image/*" multiple hidden>
        </label>
      </div>
    </div>

    <div class="photo-grid" id="photo-grid"></div>
    <p class="album-empty" id="album-empty" hidden></p>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="图片大图">
    <button class="lb-close" id="lb-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <div class="lb-stage">
      <img id="lb-img" src="" alt="">
      <div class="lb-foot">
        <p class="cap" id="lb-cap"></p>
        <div class="lb-tools" id="lb-tools" hidden>
          <input class="lb-rename" id="lb-rename" type="text" maxlength="24" aria-label="照片标题" placeholder="给这张照片起个名字">
          <button class="lb-btn" id="lb-save" type="button">保存</button>
          <button class="lb-btn danger" id="lb-del" type="button">删除</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div id="aplayer-mount"></div>

<script src="assets/vendor/APlayer.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/chrome.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/post.js"></script>
<script src="assets/js/music.js"></script>
<script src="assets/js/router.js"></script>
</body>
</html>
